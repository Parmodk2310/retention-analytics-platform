global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: retention-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: retention-event-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - event-worker:9101