name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/retention_test
      DATABASE_URL_SYNC: postgresql+psycopg://ci_user:ci_password@localhost:5432/retention_test

    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: pytest -q
      - run: bandit -q -r app -x app/ml/artifacts
      - run: pip-audit -r requirements.txt
